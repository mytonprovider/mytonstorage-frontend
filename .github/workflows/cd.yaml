name: CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mytonstorage-frontend:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            --build-arg VITE_API_URL="https://mytonstorage.org" \
            --build-arg VITE_SITE_URL="https://mytonstorage.org" \
            --build-arg VITE_TONCONNECT_MANIFEST_URL="https://mytonstorage.org/tonconnect-manifest.json" \
            -t "$IMAGE" .

          docker push "$IMAGE"

      - name: Check SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -lf /tmp/deploy_key

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/mytonstorage-frontend

            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${{ env.IMAGE }}|" .env.hub

            task hub:up
