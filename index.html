<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" content="%BG_LIGHT%" />
    <title>My TON Storage</title>
    <meta name="description" content="Store files in TON Storage: upload, pick providers, pay and track storage contracts" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="My TON Storage" />
    <meta property="og:title" content="My TON Storage" />
    <meta property="og:description" content="Store files in TON Storage: upload, pick providers, pay and track storage contracts" />
    <meta property="og:image" content="%SITE_URL%/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My TON Storage" />
    <meta name="twitter:description" content="Store files in TON Storage: upload, pick providers, pay and track storage contracts" />
    <meta name="twitter:image" content="%SITE_URL%/banner.png" />
    <script>
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem("mts_theme")
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "%BG_DARK%" : "%BG_LIGHT%"
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
